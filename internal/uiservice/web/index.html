<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>CCWRAP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='4' fill='%2310b981'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2306140f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/session.css">
<link rel="stylesheet" href="/assets/css/pages.css">
<script type="module" src="/assets/js/main.js"></script>
</head>
<body data-token="{{.Token}}" data-instance="{{.InstanceID}}" data-version="{{.Version}}" data-address="{{.Address}}" data-deny="{{.Deny}}" data-openai="{{.OpenAI}}">
{{.Sprite}}
<div class="app" id="app" data-conn="connecting" data-layout="full">
  <header class="appbar" id="appbar"></header>
  <div id="banner"></div>
  <div class="shell" id="shell">
    <div class="sidebar-slot"><nav class="sidebar" id="sidebar" aria-label="ccwrap ui"></nav></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts"></div>
</div>
<noscript><p class="noscript">ccwrap ui needs JavaScript.</p></noscript>
</body>
</html>
