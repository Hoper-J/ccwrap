name: Fingerprint Drift Watch

# ccwrap's whole value is that the upstream sees Claude Code's REAL TLS
# fingerprint, not ccwrap's: native TLS mirrors the ClientHello Claude Code
# sends, and fails closed when it cannot. Claude Code ships as a native (Bun)
# binary, so a Claude Code release can change that hello at any time — and a
# hello utls cannot reproduce would make ccwrap block every Anthropic request.
# Normal CI only replays committed hellos offline; this scheduled job checks
# the live ones so drift surfaces proactively instead of in the field:
#
#   - TestLiveClaudeFingerprintMirror: every ClientHello the LATEST Claude Code
#     sends (it runs more than one TLS stack) must mirror byte-faithfully, and
#     through ccwrap each request must go upstream with its own connection's
#     hello (hard fail); a stack differing from the committed baseline is
#     surfaced as a warning.
#   - TestLiveFingerprintCompare: the same mirror check against live
#     node/undici, kept as a regression net for the mirror machinery.
#   - TestLiveClaudeHeaderWireOrder: the request head ccwrap forwards must keep
#     the latest Claude Code's header order and casing (hard fail), so the
#     HTTP layer under the mirrored TLS stays Claude Code's too.
#   - TestLiveClaudeReminderSwitches: the latest Claude Code must still read the
#     reminder env switches ccwrap sets for non-Claude aliases; a missing one
#     is surfaced as a warning.
#   - TestLiveClaudeAnthropicProfile: with ccwrap's placeholder credential, the
#     latest Claude Code must leave Anthropic SDK profiles alone instead of
#     following a profile's base_url past ccwrap (hard fail); a change in how it
#     picks up a profile on its own credentials is surfaced as a warning.
#   - TestLiveClaudeSettingsRoute: likewise for routing env in Claude Code's own
#     settings files (ANTHROPIC_BASE_URL, a provider switch): dropped under
#     ccwrap's placeholder (hard fail if not), followed on Claude Code's own
#     credentials (a warning if not).
#
# NOTE: GitHub auto-disables `schedule` workflows after ~60 days without repo
# activity — exactly the maintenance-lull window when drift is most likely to
# go unnoticed. If the repo goes quiet, this watch silently stops; re-enable it
# under the Actions tab (or push any commit).
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {} # allow on-demand runs

permissions:
  contents: read

jobs:
  livefp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
      - name: install the latest Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest --no-audit --no-fund
          claude --version
      - name: guard against a vacuous run
        # The livefp tests are committed, but keep this guard as defense in
        # depth against them being deleted or re-gitignored: `go test -run X`
        # exits 0 when zero tests match. The checks on the live step below would
        # also catch that — but only after spending a live run; this one fails
        # first, with a message that names the remediation. Removing a test has
        # to be a visible decision: restore it or retire this workflow with it.
        run: |
          for f in internal/supervisor/livefp_test.go internal/supervisor/livefp_claude_test.go cmd/ccwrap/livefp_header_order_test.go internal/preflight/livefp_reminder_test.go cmd/ccwrap/livefp_anthropic_profile_test.go cmd/ccwrap/livefp_claude_settings_test.go; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the checkout. The fingerprint drift watch CANNOT run — restore the livefp test or remove this workflow."
              exit 1
            fi
          done
      - name: live mirror-fidelity + baseline check
        # Hard-fails if ccwrap's mirrored ClientHello != the live one (mirror
        # broke), its forwarded head loses Claude Code's layout, or Claude Code
        # follows an Anthropic profile or its own settings' routing env past
        # ccwrap's placeholder credential.
        # CCWRAP_LIVEFP_REQUIRE_CLAUDE turns a missing claude into a
        # failure instead of a skip. Belt-and-braces: also fail if the -run
        # pattern matched nothing or the Claude Code test did not pass (e.g. a
        # rename) — see the vacuous-run guard above.
        env:
          CCWRAP_LIVEFP_REQUIRE_CLAUDE: "1"
        run: |
          out=$(go test ./internal/supervisor/ ./cmd/ccwrap/ ./internal/preflight/ -tags livefp -run 'TestLiveFingerprintCompare|TestLiveClaudeFingerprintMirror|TestLiveClaudeHeaderWireOrder|TestLiveClaudeReminderSwitches|TestLiveClaudeAnthropicProfile|TestLiveClaudeSettingsRoute' -v 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -q "no tests to run"; then
            echo "::error::the -run pattern matched no tests; the drift watch ran vacuously."
            exit 1
          fi
          for t in TestLiveFingerprintCompare TestLiveClaudeFingerprintMirror TestLiveClaudeHeaderWireOrder TestLiveClaudeReminderSwitches TestLiveClaudeAnthropicProfile TestLiveClaudeSettingsRoute; do
            if ! echo "$out" | grep -q -- "--- PASS: $t "; then
              echo "::error::$t did not run to a PASS; the drift watch ran vacuously."
              exit 1
            fi
          done
          if drift=$(echo "$out" | grep -m1 -o 'CLAUDE_FINGERPRINT_DRIFT.*'); then
            echo "::warning title=Claude Code TLS fingerprint drift::$drift"
          fi
          echo "$out" | grep -o 'CLAUDE_REMINDER_SWITCH_MISSING.*' | while read -r missing; do
            echo "::warning title=Claude Code reminder switch missing::$missing"
          done
          if drift=$(echo "$out" | grep -m1 -o 'CLAUDE_ANTHROPIC_PROFILE_DRIFT.*'); then
            echo "::warning title=Claude Code Anthropic profile drift::$drift"
          fi
          if drift=$(echo "$out" | grep -m1 -o 'CLAUDE_SETTINGS_ROUTE_DRIFT.*'); then
            echo "::warning title=Claude Code settings route drift::$drift"
          fi
